services:
  db:
    container_name: mssql
    build:
      context: .
      dockerfile: mssql.Dockerfile
    env_file: mssql.env
    volumes:
      - ./data/mssql:/var/opt/mssql/data
    platform: linux/amd64
    ports:
      - "1434:1433"
    security_opt:
      - no-new-privileges:true
    networks:
      - local
  cache:
    build:
      context: .
      dockerfile: redis.Dockerfile
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - local
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--user",
          "app",
          "--pass",
          "Passw0rd_2026",
          "PING"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  console:
    build:
      context: .
      dockerfile: local.Dockerfile
    env_file:
      - .env.local
    working_dir: /app
    container_name: local-console
    volumes:
      - .:/app
    tty: true
    networks:
      - local
    depends_on:
      - db
      - cache
networks:
  local:
    driver: bridge